<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bull-Tunn</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="auth" class="auth hidden">
  <form class="auth-card" id="auth-form">
    <div class="brand big"><img class="logo" src="/static/logo.svg" alt=""><span>Bull-Tunn</span></div>
    <p class="muted" id="auth-sub">Sign in to the tunnel panel</p>
    <label>Username<input name="username" autocomplete="username" required value="admin"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <button class="btn primary wide" type="submit" id="auth-btn">Sign in</button>
    <p class="error" id="auth-err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand"><img class="logo" src="/static/logo.svg" alt=""><span>Bull-Tunn</span><span class="ver" id="ver"></span></div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <span class="live" id="live" title="Live connection to the panel"><i></i><span id="last-check">—</span></span>
      <button class="btn" id="btn-scan" title="Find the tunnels that already run on the servers">Find tunnels</button>
      <button class="btn" id="btn-check" title="Check every path right now">Check</button>
      <button class="btn primary" id="btn-discover" title="Build the tunnels that are not built yet, with the best protocol">Test &amp; connect</button>
      <div class="menu">
        <button class="btn" id="btn-add">＋ Add</button>
        <div class="menu-pop" id="add-pop">
          <button data-add="kharej">Foreign server</button>
          <button data-add="iran">Iran server</button>
          <button data-add="link">New tunnel</button>
          <button data-add="provider">DNS account</button>
          <button data-add="domain">Domain</button>
        </div>
      </div>
      <button class="btn icon" id="btn-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 .3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="btn icon" id="btn-theme" title="Light / dark" aria-label="Theme">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
      <button class="btn icon" id="btn-logout" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="canvas" id="canvas">
      <div class="world" id="world" dir="ltr">
        <svg class="wires" id="wires"></svg>
        <div id="nodes"></div>
      </div>
      <div class="legend" id="legend">
        <span><i class="sw up"></i>Up</span>
        <span><i class="sw degraded"></i>Unstable</span>
        <span><i class="sw down"></i>Down</span>
        <span><i class="sw testing"></i>Testing</span>
        <span><i class="sw handover"></i>Ports handed over</span>
        <span><i class="flow"></i>Traffic path</span>
        <span><i class="sw exit"></i>Forwarded to another server</span>
      </div>
      <div class="tools" id="tools">
        <button class="tool" data-zoom="in" title="Zoom in">＋</button>
        <span class="zoom-val" id="zoom-val">100%</span>
        <button class="tool" data-zoom="out" title="Zoom out">－</button>
        <span class="tool-sep"></span>
        <button class="tool" data-zoom="fit" title="Show everything">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="tool" data-zoom="reset" title="Default layout">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
        </button>
        <label class="tool-check" title="Healthy standby tunnels"><input type="checkbox" id="show-standby" checked> Standbys</label>
      </div>
      <div class="empty-hint hidden" id="empty-hint"></div>
    </section>

    <section class="lower">
      <div class="panel">
        <div class="panel-head">
          <h3>Tunnels</h3>
          <label class="tool-check"><input type="checkbox" id="show-pending"> Show the ones not built</label>
        </div>
        <div class="table-wrap"><table class="links" id="links-table"></table></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h3>Events</h3>
          <div class="seg" id="ev-filter">
            <button data-f="all" class="on">All</button>
            <button data-f="error">Errors</button>
            <button data-f="warning">Warnings</button>
            <button data-f="success">Success</button>
          </div>
        </div>
        <ol class="events" id="events"></ol>
      </div>
    </section>
  </main>

  <aside class="drawer" id="drawer"><div class="drawer-inner" id="drawer-body"></div></aside>
  <div class="scrim" id="scrim"></div>
  <div class="modal" id="modal"><form class="modal-card" id="modal-form"></form></div>
  <div class="tip" id="tip"></div>
  <div class="toasts" id="toasts"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
