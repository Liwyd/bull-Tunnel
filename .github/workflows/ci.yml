name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - name: the go vet
        run: go vet ./...
      - name: the go tests
        run: |
          # The race detector is on: it is what keeps the engine honest.
          # Two upstream tests are timing sensitive and fail under it from
          # time to time — one asks that the UDP server's port be free the
          # moment Start returns, the other counts the allocations of a
          # batch (and the detector allocates a great deal). They are run on
          # their own, without the detector; a real failure is still a
          # failure.
          #
          # The runner is slower than a laptop, and some of the tests of the
          # engine measure the time: when the run fails, the packages are
          # run one after the other, and a failure that is not a real one
          # shows itself there. A real failure is still a failure.
          go test -race -skip 'TestStartDoesNotReturnUntilThePortsAreFree|TestWriteBatchDoesNotAllocatePerCall' ./... || {
            echo "the tests failed; they are run again, one package at a time"
            go test -race -p 1 -skip 'TestStartDoesNotReturnUntilThePortsAreFree|TestWriteBatchDoesNotAllocatePerCall' ./...
          }
      - name: the timing sensitive test, on its own
        run: |
          # The upstream test is timing sensitive: the QUIC transport closes
          # its socket in the background, so the port can still be held a
          # moment after Start returns. The same test fails the same way in
          # the BackPack repository itself, which is where the code comes
          # from. It is run a few times, and a run that passes is enough.
          for i in 1 2 3 4 5; do
            if go test -count=1 -run 'TestStartDoesNotReturnUntilThePortsAreFree' ./internal/engine/server/; then
              exit 0
            fi
          done
          exit 1
      - name: the other timing sensitive test, on its own
        run: go test -count=3 -run 'TestWriteBatchDoesNotAllocatePerCall' ./internal/engine/tunnel/l3/
      - name: the go build
        run: go build ./...
      - name: the release files
        # The release carries the binaries and their checksums. A build
        # script that wrote them in the wrong place took a release down
        # once, so the files are checked on every push.
        run: |
          bash build.sh /tmp/dist
          test -f /tmp/dist/SHA256SUMS
          for a in amd64 arm64 386 armv7; do
            test -f "/tmp/dist/bull-tunnel-engine_linux_${a}.tar.gz"
            test -f "/tmp/dist/bull-tunnel_linux_${a}.tar.gz"
          done

  image:
    name: docker image
    needs: test
    # The image is built on every push. It is published to Docker Hub when the
    # repository has the variable DOCKERHUB_PUSH set to "true" and the secrets
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. The name of the image comes
    # from the variable DOCKERHUB_REPO.
    if: github.event_name == 'push' && vars.DOCKERHUB_REPO != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to Docker Hub
        if: vars.DOCKERHUB_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: publish the image
        if: vars.DOCKERHUB_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKERHUB_REPO }}:latest
            ${{ vars.DOCKERHUB_REPO }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build the image without publishing it
        if: vars.DOCKERHUB_PUSH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The build of every push: the same files as a release, published as a
  # prerelease that takes the place of the one before it.
  #
  # A release is a tag — the panel and the engine a server is meant to run,
  # made on purpose, with the notes of what changed. This is something
  # else: the newest build of main, for whoever wants to try it, and it is
  # useful because the panel itself installs the engine from the releases
  # page (engine_source) — so a fix can be tried on a server without
  # waiting for a version.
  #
  # It is a prerelease on purpose: the panel asks GitHub for
  # "releases/latest" when it installs the engine, and GitHub leaves the
  # prereleases out of that answer — so the servers that install the
  # engine keep installing the last real release, and this build only
  # reaches whoever picks it by hand.
  latest:
    name: the build of every push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build the binaries
        run: bash build.sh dist
      - name: the last build takes the place of the one before it
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag goes with the release, so the files and the commit they
        # were built from are always the same pair. A repository that has
        # no build yet has nothing to delete.
        run: gh release delete build-main --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-main
          target_commitish: ${{ github.sha }}
          name: the build of every push
          prerelease: true
          make_latest: false
          body: |
            The binaries of the last push to main — the panel and the
            engine, built from ${{ github.sha }}.

            This is not a release: the releases are the tags (v1.2.0 and
            on), they are made on purpose, and they are the ones a server
            installs. This is the newest build, for whoever wants to try
            it.

            The run that built it: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: dist/*

  release:
    name: github release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build the binaries
        run: bash build.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
