name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - name: the go vet
        run: go vet ./...
      - name: the go tests
        run: |
          # The race detector is on: it is what keeps the engine honest.
          # Two upstream tests are timing sensitive and fail under it from
          # time to time — one asks that the UDP server's port be free the
          # moment Start returns, the other counts the allocations of a
          # batch (and the detector allocates a great deal). They are run on
          # their own, without the detector; a real failure is still a
          # failure.
          #
          # The runner is slower than a laptop, and some of the tests of the
          # engine measure the time: when the run fails, the packages are
          # run one after the other, and a failure that is not a real one
          # shows itself there. A real failure is still a failure.
          go test -race -skip 'TestStartDoesNotReturnUntilThePortsAreFree|TestWriteBatchDoesNotAllocatePerCall' ./... || {
            echo "the tests failed; they are run again, one package at a time"
            go test -race -p 1 -skip 'TestStartDoesNotReturnUntilThePortsAreFree|TestWriteBatchDoesNotAllocatePerCall' ./...
          }
      - name: the timing sensitive test, on its own
        run: |
          # The upstream test is timing sensitive: the QUIC transport closes
          # its socket in the background, so the port can still be held a
          # moment after Start returns. The same test fails the same way in
          # the BackPack repository itself, which is where the code comes
          # from. It is run a few times, and a run that passes is enough.
          for i in 1 2 3 4 5; do
            if go test -count=1 -run 'TestStartDoesNotReturnUntilThePortsAreFree' ./internal/engine/server/; then
              exit 0
            fi
          done
          exit 1
      - name: the other timing sensitive test, on its own
        run: go test -count=3 -run 'TestWriteBatchDoesNotAllocatePerCall' ./internal/engine/tunnel/l3/
      - name: the go build
        run: go build ./...
      - name: the release files
        # The release carries the binaries and their checksums. A build
        # script that wrote them in the wrong place took a release down
        # once, so the files are checked on every push.
        run: |
          bash build.sh /tmp/dist
          test -f /tmp/dist/SHA256SUMS
          for a in amd64 arm64 386 armv7; do
            test -f "/tmp/dist/bull-tunnel-engine_linux_${a}.tar.gz"
            test -f "/tmp/dist/bull-tunnel_linux_${a}.tar.gz"
          done
      - name: the script of the panel parses
        run: node --check static/app.js
      - name: the installation
        # The files built a step above are unpacked and run the way an
        # installation runs them — from a fresh data directory, with the
        # web interface beside the panel — and asked everything an
        # operator asks on the first day: the door, the sign-in, the
        # dashboard, the drawer, the forms, the settings and a
        # connection test. It needs no root and no server.
        run: bash tests/install-check.sh --dist /tmp/dist

  image:
    name: docker image
    needs: test
    # The image is built on every push. It is published to Docker Hub when the
    # repository has the variable DOCKERHUB_PUSH set to "true" and the secrets
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. The name of the image comes
    # from the variable DOCKERHUB_REPO.
    if: github.event_name == 'push' && vars.DOCKERHUB_REPO != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to Docker Hub
        if: vars.DOCKERHUB_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: publish the image
        if: vars.DOCKERHUB_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKERHUB_REPO }}:latest
            ${{ vars.DOCKERHUB_REPO }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build the image without publishing it
        if: vars.DOCKERHUB_PUSH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The release of every push: the same files as a tagged release,
  # published on every push to main that passed the tests, in the place of
  # the one before it.
  #
  # The release is used in execution: the panel installs the tunnel engine
  # from this releases page (engine_source, "releases/latest"), so the
  # release that runs must not go stale between tags — the CI keeps it
  # current itself. Two things make that safe: the job only runs after the
  # tests have passed, and it is the release marked latest, so it is the
  # one "releases/latest" answers with.
  #
  # The tagged releases (the v* tags) are the other half: made on purpose,
  # with the notes of what changed, and the versions an operator pins when
  # a server must not move.
  latest:
    name: the release of every push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build the binaries
        run: bash build.sh dist
      - name: the last build takes the place of the one before it
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag goes with the release, so the files and the commit they
        # were built from are always the same pair. A repository that has
        # no build yet has nothing to delete.
        run: gh release delete build-main --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-main
          target_commitish: ${{ github.sha }}
          name: the release of every push
          prerelease: false
          make_latest: true
          body: |
            The binaries of the last push to main — the panel and the
            engine, built from ${{ github.sha }}.

            This release follows main: the CI replaces it on every push
            that passes the tests, so whatever installs the newest build
            always gets it — the panel asks GitHub for "releases/latest"
            when it installs the engine, and this is that release. The
            tagged releases (v1.3.0 and on) are the versions made on
            purpose, with the notes of what changed.

            The run that built it: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: dist/*

  release:
    name: github release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build the binaries
        run: bash build.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
