[project]
name = "bull-tunnel"
dynamic = ["version"]
description = "bull-Tunnel — control panel for reverse tunnels: health checks, automatic failover and Cloudflare/ArvanCloud DNS switching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bull-Tunnel contributors" }]
keywords = ["tunnel", "reverse-tunnel", "failover", "dns", "panel", "iran"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: System :: Networking",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "asyncssh>=2.23.1",
  "httpx[socks]>=0.27",
  "cryptography>=48.0.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
bull-tunnel = "bulltunnel.cli:main"

[project.urls]
Homepage = "https://github.com/Liwyd/bull-Tunnel"
Repository = "https://github.com/Liwyd/bull-Tunnel"
Issues = "https://github.com/Liwyd/bull-Tunnel/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bulltunnel", "bulltunnel.dns"]

[tool.setuptools.dynamic]
# the version has one home: the package itself
version = {attr = "bulltunnel.__version__"}

[tool.setuptools.package-data]
bulltunnel = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
