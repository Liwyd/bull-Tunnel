[project]
name = "bulltunn"
version = "1.0.0"
description = "Bull-Tunn — control panel for reverse tunnels: health checks, automatic failover and Cloudflare/ArvanCloud DNS switching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bull-Tunn contributors" }]
keywords = ["tunnel", "reverse-tunnel", "failover", "dns", "panel", "iran"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: System :: Networking",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "asyncssh>=2.14",
  "httpx[socks]>=0.27",
  "cryptography>=3.4",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
bulltunn = "bulltunn.__main__:main"

[project.urls]
Homepage = "https://github.com/Liwyd/Bull-Tunn"
Repository = "https://github.com/Liwyd/Bull-Tunn"
Issues = "https://github.com/Liwyd/Bull-Tunn/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bulltunn", "bulltunn.dns"]

[tool.setuptools.package-data]
bulltunn = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
